  <script>
    // Captura errores de JS no controlados y los manda al log local, para
    // poder diagnosticar fallas de la interfaz sin herramientas de depuración.
    function _reportarErrorJs(mensaje) {
      const intentar = (restantes) => {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.registrar_error_js) {
          window.pywebview.api.registrar_error_js(String(mensaje).slice(0, 2000));
        } else if (restantes > 0) {
          setTimeout(() => intentar(restantes - 1), 100);
        }
      };
      intentar(50);
    }
    window.addEventListener("error", (e) => {
      _reportarErrorJs(`JS error: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
    });
    window.addEventListener("unhandledrejection", (e) => {
      _reportarErrorJs(`Promesa no manejada: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`);
    });
  </script>
